<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 知选商城</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
</head>
<body>
<div class="shop-auth-wrap">
    <div class="shop-auth-card">
        <a href="/" style="text-decoration: none; color: var(--shop-text);">
            <div style="text-align: center; font-weight: 700; font-size: 20px; margin-bottom: 4px;">知选商城</div>
        </a>
        <h1>欢迎回来</h1>
        <form id="loginForm">
            <div class="mb-3">
                <label for="username" class="form-label">用户名</label>
                <input type="text" class="form-control" id="username" name="username" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">密码</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>
            <button type="submit" class="btn-shop-cta w-100" style="padding: 10px;">登录</button>
        </form>
        <div class="d-flex justify-content-between mt-3" style="font-size: 13px;">
            <a href="/register" style="color: var(--shop-brand); text-decoration: none;">创建账号</a>
            <a href="/" style="color: var(--shop-muted); text-decoration: none;">返回首页</a>
        </div>
        <p style="color: var(--shop-faint); font-size: 12px; margin-top: 18px; text-align: center;">
            演示账号：admin / 123456（管理员）、test / 123456（用户）
        </p>
    </div>
</div>
<div class="shop-toast" id="shopToast"></div>
<script>
    let toastTimer;
    function showToast(text) {
        const el = document.getElementById('shopToast');
        el.textContent = text;
        el.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
    }
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const form = new FormData(e.target);
        const resp = await fetch('/api/auth/login', { method: 'POST', body: form });
        const result = await resp.json();
        if (result.code === 1) {
            showToast('登录成功，欢迎回来');
            setTimeout(() => location.href = '/', 500);
        } else {
            showToast(result.message || '登录失败');
        }
    });
</script>
</body>
</html>
