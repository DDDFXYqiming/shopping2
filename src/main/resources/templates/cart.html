<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>购物车 - 知选商城</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
</head>
<body>
<nav class="shop-nav">
    <div class="container d-flex align-items-center justify-content-between">
        <a class="navbar-brand" href="/">知选商城</a>
        <div class="d-flex align-items-center gap-3">
            <a class="btn-shop-ghost" th:href="@{/}">继续购物</a>
        </div>
    </div>
</nav>
<div class="container py-4" style="max-width: 760px;">
    <h3 style="font-size: 22px; font-weight: 700; margin-bottom: 20px;">购物车</h3>
    <div class="shop-panel" th:if="${cartList == null or #lists.isEmpty(cartList)}">
        <div class="shop-empty">
            <p style="font-size: 16px; margin-bottom: 4px;">购物车还是空的</p>
            <p style="font-size: 13px;">去挑几件喜欢的商品吧</p>
            <a class="btn-shop-primary" style="display: inline-block; margin-top: 12px;" th:href="@{/}">去逛逛</a>
        </div>
    </div>
    <div th:if="${cartList != null and !#lists.isEmpty(cartList)}">
        <div class="shop-panel">
            <div class="shop-cart-row" th:each="cart : ${cartList}">
                <div>
                    <div style="font-weight: 600;" th:text="${cart.cartProductName}"></div>
                    <div style="color: var(--shop-muted); font-size: 13px;"
                         th:text="'单价 ¥' + ${cart.cartProductPrice}"></div>
                </div>
                <div class="d-flex align-items-center gap-3">
                    <div class="shop-qty-control">
                        <button class="qty-btn" th:attr="data-id=${cart.cartId}" onclick="decrease(this)">−</button>
                        <span style="min-width: 24px; text-align: center; font-weight: 600;" th:text="${cart.cartProductNums}"></span>
                        <button class="qty-btn" th:attr="data-id=${cart.cartId}" onclick="increase(this)">＋</button>
                    </div>
                    <span style="font-weight: 600; min-width: 64px; text-align: right;"
                          th:text="'¥' + ${cart.cartProductPrice * cart.cartProductNums}"></span>
                </div>
            </div>
        </div>
        <div class="d-flex align-items-center justify-content-between mt-4">
            <div>
                <div style="color: var(--shop-muted); font-size: 13px;">合计</div>
                <div class="shop-total" th:text="'¥' + ${totalPrice}"></div>
            </div>
            <a class="btn-shop-cta" style="font-size: 15px; padding: 10px 28px;" th:href="@{/cart/settlement}">去结算</a>
        </div>
    </div>
</div>
<div class="shop-toast" id="shopToast"></div>
<script>
    let toastTimer;
    function showToast(text) {
        const el = document.getElementById('shopToast');
        el.textContent = text;
        el.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
    }
    async function increase(btn) {
        await fetch('/api/cart/' + btn.dataset.id + '/increase', { method: 'POST' });
        location.reload();
    }
    async function decrease(btn) {
        await fetch('/api/cart/' + btn.dataset.id + '/decrease', { method: 'POST' });
        location.reload();
    }
</script>
</body>
</html>
