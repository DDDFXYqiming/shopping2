<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>购物车</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4" style="max-width: 720px;">
    <h1 class="h4 mb-4">购物车</h1>
    <th:block th:if="${cartList == null or #lists.isEmpty(cartList)}">
        <p class="text-muted">购物车是空的，快去挑选商品吧。</p>
    </th:block>
    <div class="card mb-3" th:each="cart : ${cartList}">
        <div class="card-body d-flex justify-content-between align-items-center">
            <div>
                <div class="fw-bold" th:text="${cart.cartProductName}"></div>
                <div class="text-muted small">
                    价格：<span th:text="${cart.cartProductPrice}"></span>　已选数量：<span th:text="${cart.cartProductNums}"></span>
                </div>
            </div>
            <div class="d-flex gap-2">
                <button class="btn btn-outline-secondary btn-sm" th:attr="data-id=${cart.cartId}" onclick="decrease(this)">移出</button>
                <button class="btn btn-primary btn-sm" th:attr="data-id=${cart.cartId}" onclick="increase(this)">添加</button>
            </div>
        </div>
    </div>
    <div class="d-flex gap-2">
        <a class="btn btn-secondary" th:href="@{/}">返回</a>
        <a class="btn btn-success" th:href="@{/cart/settlement}">商品结算</a>
    </div>
</div>
<script>
    async function increase(btn) {
        await fetch('/api/cart/' + btn.dataset.id + '/increase', { method: 'POST' });
        location.reload();
    }
    async function decrease(btn) {
        await fetch('/api/cart/' + btn.dataset.id + '/decrease', { method: 'POST' });
        location.reload();
    }
</script>
</body>
</html>
