<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修改商品</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4" style="max-width: 480px;">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h1 class="h4 mb-4">修改商品</h1>
            <form id="modifyForm" th:attr="data-id=${product.productId}">
                <div class="mb-3">
                    <label class="form-label">名称</label>
                    <input type="text" class="form-control" name="PRODUCT_NAME" th:value="${product.productName}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">描述</label>
                    <textarea class="form-control" name="PRODUCT_DESCRIPTION" rows="3" th:text="${product.productDescription}"></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label">价格</label>
                    <input type="number" class="form-control" name="PRODUCT_PRICE" th:value="${product.productPrice}" min="0" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">库存</label>
                    <input type="number" class="form-control" name="PRODUCT_STOCK" th:value="${product.productStock}" min="0" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">保存修改</button>
            </form>
            <div class="mt-3"><a th:href="@{/}">返回主页</a></div>
        </div>
    </div>
</div>
<script>
    document.getElementById('modifyForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const form = new FormData(e.target);
        const resp = await fetch('/api/products/' + e.target.dataset.id, { method: 'PUT', body: form });
        const result = await resp.json();
        alert(result.message || '操作失败');
        if (result.code === 1) location.href = '/';
    });
</script>
</body>
</html>
