<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修改商品 - 知选商城</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
</head>
<body>
<nav class="shop-nav">
    <div class="container d-flex align-items-center justify-content-between">
        <a class="navbar-brand" href="/">知选商城 · 管理</a>
        <a class="btn-shop-ghost" th:href="@{/}">返回前台</a>
    </div>
</nav>
<div class="container py-4" style="max-width: 560px;">
    <div class="shop-panel">
        <h3 style="font-size: 20px; font-weight: 700; margin-bottom: 20px;">修改商品</h3>
        <form id="modifyForm" th:attr="data-id=${product.productId}">
            <div class="mb-3">
                <label class="form-label">商品名称</label>
                <input type="text" class="form-control" name="PRODUCT_NAME" th:value="${product.productName}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">商品描述</label>
                <textarea class="form-control" name="PRODUCT_DESCRIPTION" rows="3" th:text="${product.productDescription}"></textarea>
            </div>
            <div class="row g-3 mb-3">
                <div class="col">
                    <label class="form-label">价格（元）</label>
                    <input type="number" class="form-control" name="PRODUCT_PRICE" th:value="${product.productPrice}" min="0" required>
                </div>
                <div class="col">
                    <label class="form-label">库存</label>
                    <input type="number" class="form-control" name="PRODUCT_STOCK" th:value="${product.productStock}" min="0" required>
                </div>
            </div>
            <button type="submit" class="btn-shop-cta w-100" style="padding: 10px;">保存修改</button>
        </form>
    </div>
</div>
<div class="shop-toast" id="shopToast"></div>
<script>
    let toastTimer;
    function showToast(text) {
        const el = document.getElementById('shopToast');
        el.textContent = text;
        el.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
    }
    document.getElementById('modifyForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const form = new FormData(e.target);
        const resp = await fetch('/api/products/' + e.target.dataset.id, { method: 'PUT', body: form });
        const result = await resp.json();
        showToast(result.message || '操作失败');
        if (result.code === 1) setTimeout(() => location.href = '/', 700);
    });
</script>
</body>
</html>
