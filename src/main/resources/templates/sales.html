<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>销售统计 - 知选商城</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
</head>
<body>
<nav class="shop-nav">
    <div class="container d-flex align-items-center justify-content-between">
        <a class="navbar-brand" href="/">知选商城 · 管理</a>
        <a class="btn-shop-ghost" th:href="@{/}">返回前台</a>
    </div>
</nav>
<div class="container py-4">
    <h3 style="font-size: 22px; font-weight: 700; margin-bottom: 20px;">销售统计报表</h3>
    <div class="shop-table-card">
        <table class="table align-middle">
            <thead>
            <tr><th>商品名称</th><th>单价</th><th>已销售数量</th><th>销售额</th></tr>
            </thead>
            <tbody>
            <tr th:each="cart : ${sales}">
                <td style="font-weight: 500;" th:text="${cart.cartProductName}"></td>
                <td th:text="'¥' + ${cart.cartProductPrice}"></td>
                <td th:text="${cart.cartProductNums}"></td>
                <td style="font-weight: 600;" th:text="'¥' + ${cart.cartProductPrice * cart.cartProductNums}"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(sales)}"><td colspan="4" class="shop-empty">暂无销售记录</td></tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
