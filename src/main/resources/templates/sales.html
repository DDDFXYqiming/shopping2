<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>销售统计报表</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <h1 class="h4 mb-4">销售统计报表</h1>
    <table class="table table-bordered bg-white">
        <thead class="table-light">
        <tr><th>商品名称</th><th>商品价格</th><th>已销售数量</th></tr>
        </thead>
        <tbody>
        <tr th:each="cart : ${sales}">
            <td th:text="${cart.cartProductName}"></td>
            <td th:text="${cart.cartProductPrice}"></td>
            <td th:text="${cart.cartProductNums}"></td>
        </tr>
        <tr th:if="${#lists.isEmpty(sales)}"><td colspan="3" class="text-muted">暂无销售记录</td></tr>
        </tbody>
    </table>
    <a class="btn btn-secondary" th:href="@{/}">返回</a>
</div>
</body>
</html>
