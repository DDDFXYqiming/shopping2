<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 知选商城</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
</head>
<body>
<div class="shop-auth-wrap">
    <div class="shop-auth-card">
        <a href="/" style="text-decoration: none; color: var(--shop-text);">
            <div style="text-align: center; font-weight: 700; font-size: 20px; margin-bottom: 4px;">知选商城</div>
        </a>
        <h1>创建账号</h1>
        <form id="registerForm">
            <div class="mb-3">
                <label class="form-label">用户名</label>
                <input type="text" class="form-control" name="name" placeholder="请输入用户名" required>
            </div>
            <div class="mb-3">
                <label class="form-label">密码</label>
                <input type="password" class="form-control" name="password" placeholder="请输入密码" required>
            </div>
            <div class="mb-3">
                <label class="form-label">邮箱</label>
                <input type="email" class="form-control" name="email" placeholder="请输入邮箱">
            </div>
            <button type="submit" class="btn-shop-cta w-100" style="padding: 10px;">注册</button>
        </form>
        <div class="text-center mt-3" style="font-size: 13px;">
            <a href="/login" style="color: var(--shop-brand); text-decoration: none;">已有账号？去登录</a>
        </div>
    </div>
</div>
<div class="shop-toast" id="shopToast"></div>
<script>
    let toastTimer;
    function showToast(text) {
        const el = document.getElementById('shopToast');
        el.textContent = text;
        el.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
    }
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const form = new FormData(e.target);
        const resp = await fetch('/api/auth/register', { method: 'POST', body: form });
        const result = await resp.json();
        if (result.code === 1) {
            showToast('注册成功，请登录');
            setTimeout(() => location.href = '/login', 800);
        } else {
            showToast(result.message || '注册失败');
        }
    });
</script>
</body>
</html>
