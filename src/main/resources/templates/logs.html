<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>客户日志 - 知选商城</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
</head>
<body>
<nav class="shop-nav">
    <div class="container d-flex align-items-center justify-content-between">
        <a class="navbar-brand" href="/">知选商城 · 管理</a>
        <a class="btn-shop-ghost" th:href="@{/}">返回前台</a>
    </div>
</nav>
<div class="container py-4">
    <h3 style="font-size: 22px; font-weight: 700; margin-bottom: 12px;">客户日志</h3>
    <form class="shop-search" method="get" action="/admin/logs">
        <input type="number" class="form-control" name="userId" placeholder="按用户 ID 查询" min="1">
        <button type="submit" class="btn-shop-primary">查询</button>
    </form>

    <h5 style="font-weight: 600; margin: 24px 0 12px;">购买日志</h5>
    <div class="shop-table-card">
        <table class="table align-middle">
            <thead>
            <tr><th>商品</th><th>单价</th><th>数量</th><th>用户 ID</th><th>状态</th><th>更新时间</th></tr>
            </thead>
            <tbody>
            <tr th:each="cart : ${logs.purchased}">
                <td th:text="${cart.cartProductName}"></td>
                <td th:text="'¥' + ${cart.cartProductPrice}"></td>
                <td th:text="${cart.cartProductNums}"></td>
                <td th:text="${cart.cartUserId}"></td>
                <td><span class="saas-status saas-status--done">已购买</span></td>
                <td th:text="${cart.updatedAt}"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(logs.purchased)}"><td colspan="6" class="shop-empty">暂无购买记录</td></tr>
            </tbody>
        </table>
    </div>

    <h5 style="font-weight: 600; margin: 24px 0 12px;">浏览/加购日志</h5>
    <div class="shop-table-card">
        <table class="table align-middle">
            <thead>
            <tr><th>商品</th><th>单价</th><th>数量</th><th>用户 ID</th><th>状态</th><th>创建时间</th></tr>
            </thead>
            <tbody>
            <tr th:each="cart : ${logs.browsing}">
                <td th:text="${cart.cartProductName}"></td>
                <td th:text="'¥' + ${cart.cartProductPrice}"></td>
                <td th:text="${cart.cartProductNums}"></td>
                <td th:text="${cart.cartUserId}"></td>
                <td>
                    <span class="saas-status saas-status--created"
                          th:if="${cart.cartValid == 1}">购物车中</span>
                    <span class="saas-status saas-status--done" th:if="${cart.cartValid == 0}">已购买</span>
                </td>
                <td th:text="${cart.createdAt}"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(logs.browsing)}"><td colspan="6" class="shop-empty">暂无浏览记录</td></tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
