<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>客户日志记录</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <h1 class="h4 mb-3">客户日志记录</h1>
    <form class="row g-2 mb-4" method="get" action="/admin/logs">
        <div class="col-auto">
            <input type="number" class="form-control" name="userId" placeholder="请输入查询用户id" min="1">
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-primary">查询</button>
        </div>
        <div class="col-auto">
            <a class="btn btn-secondary" th:href="@{/}">返回</a>
        </div>
    </form>
    <h2 class="h5 mt-4">客户购买日志记录</h2>
    <table class="table table-bordered bg-white">
        <thead class="table-light">
        <tr><th>商品名称</th><th>商品价格</th><th>商品数量</th><th>用户ID</th><th>购物车状态</th><th>创建时间</th><th>更新时间</th></tr>
        </thead>
        <tbody>
        <tr th:each="cart : ${logs.purchased}">
            <td th:text="${cart.cartProductName}"></td>
            <td th:text="${cart.cartProductPrice}"></td>
            <td th:text="${cart.cartProductNums}"></td>
            <td th:text="${cart.cartUserId}"></td>
            <td th:text="${cart.cartValid}"></td>
            <td th:text="${cart.createdAt}"></td>
            <td th:text="${cart.updatedAt}"></td>
        </tr>
        <tr th:if="${#lists.isEmpty(logs.purchased)}"><td colspan="7" class="text-muted">暂无购买记录</td></tr>
        </tbody>
    </table>
    <h2 class="h5 mt-4">客户浏览日志记录</h2>
    <table class="table table-bordered bg-white">
        <thead class="table-light">
        <tr><th>商品名称</th><th>商品价格</th><th>商品数量</th><th>用户ID</th><th>购物车状态</th><th>创建时间</th><th>更新时间</th></tr>
        </thead>
        <tbody>
        <tr th:each="cart : ${logs.browsing}">
            <td th:text="${cart.cartProductName}"></td>
            <td th:text="${cart.cartProductPrice}"></td>
            <td th:text="${cart.cartProductNums}"></td>
            <td th:text="${cart.cartUserId}"></td>
            <td th:text="${cart.cartValid}"></td>
            <td th:text="${cart.createdAt}"></td>
            <td th:text="${cart.updatedAt}"></td>
        </tr>
        <tr th:if="${#lists.isEmpty(logs.browsing)}"><td colspan="7" class="text-muted">暂无浏览记录</td></tr>
        </tbody>
    </table>
</div>
</body>
</html>
