<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知选商城</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
</head>
<body>
<nav class="shop-nav">
    <div class="container d-flex align-items-center justify-content-between">
        <a class="navbar-brand" href="/">知选商城</a>
        <div class="d-flex align-items-center gap-3">
            <th:block th:if="${!isLogin}">
                <a class="btn-shop-ghost" th:href="@{/login}">登录</a>
                <a class="btn-shop-primary" th:href="@{/register}">注册</a>
            </th:block>
            <th:block th:if="${isLogin}">
                <span class="shop-user-chip" th:text="${user.name} + '（' + (${user.status} == 0 ? '管理员' : '用户') + '）'"></span>
                <a class="shop-cart-link" th:href="@{/cart}">
                    🛒 购物车
                    <span class="shop-cart-badge" th:if="${cartCount > 0}" th:text="${cartCount}"></span>
                </a>
                <button class="btn-shop-ghost" onclick="logout()">注销</button>
            </th:block>
        </div>
    </div>
</nav>

<div class="container py-4">
    <section class="shop-hero">
        <h2>欢迎来到知选商城</h2>
        <p>精选数码好物，正品保障，全场顺丰包邮。</p>
        <form class="shop-search" method="get" action="/">
            <input type="text" class="form-control" name="keyword" placeholder="搜索商品…" th:value="${keyword}">
            <button type="submit" class="btn-shop-primary">搜索</button>
        </form>
    </section>

    <th:block th:if="${isAdmin}">
        <div class="shop-admin-panel">
            <div class="panel-title">管理控制台</div>
            <div class="d-flex flex-wrap gap-2">
                <a class="btn-shop-primary" th:href="@{/product/add}">添加商品</a>
                <a class="btn-shop-ghost" th:href="@{/admin/sales}">销售统计报表</a>
                <a class="btn-shop-ghost" th:href="@{/admin/logs}">客户浏览/购买日志</a>
            </div>
        </div>
    </th:block>

    <div class="d-flex align-items-center justify-content-between mb-3">
        <h3 style="font-size: 20px; font-weight: 700; margin: 0;">全部商品</h3>
        <span style="color: var(--shop-faint); font-size: 13px;" th:text="${#lists.size(products)} + ' 件'"></span>
    </div>

    <div class="shop-grid" th:if="${!#lists.isEmpty(products)}">
        <div class="shop-card" th:each="product : ${products}">
            <div class="shop-card-media"
                 th:style="'background: linear-gradient(135deg, ' + ${product.productId % 3 == 0 ? '#6366f1' : (product.productId % 3 == 1 ? '#0ea5e9' : '#f59e0b')} + ', #1e293b);'">
                <span th:text="${#strings.substring(product.productName, 0, 1)}"></span>
            </div>
            <div class="shop-card-body">
                <div class="shop-card-title" th:text="${product.productName}"></div>
                <div class="shop-card-desc" th:text="${product.productDescription}"></div>
                <div class="d-flex align-items-baseline justify-content-between">
                    <span class="shop-card-price"><small>¥</small><span th:text="${product.productPrice}"></span></span>
                    <span class="shop-card-stock" th:text="'库存 ' + ${product.productStock}"></span>
                </div>
                <div class="shop-card-actions">
                    <button class="btn-shop-cta"
                            th:attr="data-id=${product.productId},data-name=${product.productName},data-price=${product.productPrice},data-stock=${product.productStock}"
                            onclick="addToCart(this)">加入购物车</button>
                    <th:block th:if="${isAdmin}">
                        <div class="d-flex gap-2">
                            <a class="btn-shop-ghost" style="padding: 6px 12px;" th:href="@{'/product/modify?id=' + ${product.productId}}">修改</a>
                            <button class="btn-shop-ghost" style="padding: 6px 12px; color: var(--shop-danger); border-color: #fecaca;"
                                    th:attr="data-id=${product.productId}" onclick="deleteProduct(this)">删除</button>
                        </div>
                    </th:block>
                </div>
            </div>
        </div>
    </div>

    <div class="shop-empty" th:if="${#lists.isEmpty(products)}">
        <p style="font-size: 16px; margin-bottom: 4px;">没有找到相关商品</p>
        <p style="font-size: 13px;">换个关键词试试</p>
    </div>
</div>

<footer class="shop-footer">
    <div class="container">
        知选商城 · 网络应用开发课程项目 Demo · 仅供学习展示
    </div>
</footer>

<div class="shop-toast" id="shopToast"></div>

<script>
    let toastTimer;
    function showToast(text) {
        const el = document.getElementById('shopToast');
        el.textContent = text;
        el.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
    }
    function bumpCartBadge() {
        let badge = document.querySelector('.shop-cart-badge');
        if (!badge) {
            const link = document.querySelector('.shop-cart-link');
            if (!link) return;
            badge = document.createElement('span');
            badge.className = 'shop-cart-badge';
            badge.textContent = '1';
            link.appendChild(badge);
        } else {
            badge.textContent = String(Number(badge.textContent) + 1);
        }
    }
    async function addToCart(btn) {
        const form = new FormData();
        form.append('productId', btn.dataset.id);
        const resp = await fetch('/api/cart/add', { method: 'POST', body: form });
        const result = await resp.json();
        if (result.code === 1) {
            showToast('已加入购物车 ✓');
            bumpCartBadge();
        } else {
            showToast(result.message || '操作失败');
            if (result.message && result.message.includes('登录')) {
                setTimeout(() => location.href = '/login', 900);
            }
        }
    }
    async function deleteProduct(btn) {
        if (!confirm('确定删除该商品？')) return;
        const resp = await fetch('/api/products/' + btn.dataset.id, { method: 'DELETE' });
        const result = await resp.json();
        showToast(result.message || '操作失败');
        if (result.code === 1) setTimeout(() => location.reload(), 700);
    }
    async function logout() {
        await fetch('/api/auth/logout', { method: 'POST' });
        location.href = '/';
    }
</script>
</body>
</html>
