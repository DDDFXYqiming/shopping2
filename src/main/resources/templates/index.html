<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网上购物商城</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<header class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <span class="navbar-brand">网上购物商城</span>
        <div class="d-flex align-items-center gap-2">
            <th:block th:if="${!isLogin}">
                <a class="btn btn-outline-light btn-sm" th:href="@{/login}">登录</a>
                <a class="btn btn-outline-light btn-sm" th:href="@{/register}">注册</a>
            </th:block>
            <th:block th:if="${isLogin}">
                <span class="text-white me-2" th:text="${user.name} + '（' + (${user.status} == 0 ? '管理员' : '用户') + '）'"></span>
                <a class="btn btn-outline-light btn-sm" th:href="@{/cart}">购物车</a>
                <button class="btn btn-outline-light btn-sm" onclick="logout()">注销</button>
            </th:block>
        </div>
    </div>
</header>
<div class="container my-4">
    <th:block th:if="${isAdmin}">
        <div class="alert alert-primary">当前界面为管理员界面！！！！！</div>
        <div class="mb-3">
            <a class="btn btn-success btn-sm" th:href="@{/product/add}">添加商品</a>
            <a class="btn btn-info btn-sm text-white" th:href="@{/admin/sales}">销售统计报表界面</a>
            <a class="btn btn-secondary btn-sm" th:href="@{/admin/logs}">客户的浏览/购买日志记录</a>
        </div>
    </th:block>
    <h2>欢迎光临！</h2>
    <p>这里是我们的网上购物商城，欢迎您浏览我们的商品。</p>
    <form class="row g-2 mb-4" method="get" action="/">
        <div class="col-auto">
            <input type="text" class="form-control" name="keyword" placeholder="请输入查询条件" th:value="${keyword}">
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-primary">查询</button>
        </div>
    </form>
    <div class="row g-3">
        <div class="col-md-4" th:each="product : ${products}">
            <div class="card h-100">
                <div class="card-body">
                    <h5 class="card-title" th:text="${product.productName}"></h5>
                    <p class="card-text" th:text="${product.productDescription}"></p>
                    <p class="mb-1">价格：<span th:text="${product.productPrice}"></span></p>
                    <p class="mb-2">库存：<span th:text="${product.productStock}"></span></p>
                    <button class="btn btn-primary btn-sm"
                            th:attr="data-id=${product.productId},data-name=${product.productName},data-price=${product.productPrice},data-stock=${product.productStock}"
                            onclick="addToCart(this)">添加到购物车</button>
                    <th:block th:if="${isAdmin}">
                        <div class="mt-2 d-flex gap-2">
                            <button class="btn btn-danger btn-sm" th:attr="data-id=${product.productId}" onclick="deleteProduct(this)">删除商品</button>
                            <a class="btn btn-warning btn-sm" th:href="@{'/product/modify?id=' + ${product.productId}}">修改商品信息</a>
                        </div>
                    </th:block>
                </div>
            </div>
        </div>
    </div>
    <div class="text-muted mt-3" th:if="${!#lists.isEmpty(products)}" th:text="'共 ' + ${#lists.size(products)} + ' 件商品'"></div>
</div>
<script>
    async function addToCart(btn) {
        const form = new FormData();
        form.append('productId', btn.dataset.id);
        const resp = await fetch('/api/cart/add', { method: 'POST', body: form });
        const result = await resp.json();
        if (result.code === 1) {
            alert('已加入购物车');
        } else {
            alert(result.message || '操作失败');
            if (result.message && result.message.includes('登录')) location.href = '/login';
        }
    }
    async function deleteProduct(btn) {
        if (!confirm('确定删除该商品？')) return;
        const resp = await fetch('/api/products/' + btn.dataset.id, { method: 'DELETE' });
        const result = await resp.json();
        alert(result.message || '操作失败');
        if (result.code === 1) location.reload();
    }
    async function logout() {
        await fetch('/api/auth/logout', { method: 'POST' });
        location.href = '/';
    }
</script>
</body>
</html>
