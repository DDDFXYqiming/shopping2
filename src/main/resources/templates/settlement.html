<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>结算</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4" style="max-width: 720px;">
    <h1 class="h4 mb-4">结算</h1>
    <div class="card mb-3" th:each="cart : ${cartList}">
        <div class="card-body d-flex justify-content-between">
            <div>
                <div class="fw-bold" th:text="${cart.cartProductName}"></div>
                <div class="text-muted small">
                    价格：<span th:text="${cart.cartProductPrice}"></span>　已选数量：<span th:text="${cart.cartProductNums}"></span>
                </div>
            </div>
            <div class="align-self-center" th:text="${cart.cartProductPrice * cart.cartProductNums}"></div>
        </div>
    </div>
    <h3>商品总价格：<span th:text="${totalPrice}"></span></h3>
    <div class="d-flex gap-2 mt-3">
        <a class="btn btn-secondary" th:href="@{/}">返回主页</a>
        <a class="btn btn-outline-secondary" th:href="@{/cart}">返回购物车</a>
        <button class="btn btn-primary" onclick="pay()">点击购买</button>
    </div>
</div>
<script>
    async function pay() {
        const resp = await fetch('/api/cart/pay', { method: 'POST' });
        const result = await resp.json();
        alert(result.message || '购买失败');
        if (result.code === 1) location.href = '/';
    }
</script>
</body>
</html>
